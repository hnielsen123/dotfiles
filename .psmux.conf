# Pass terminal titles through tmux
set -g set-titles on
set -g set-titles-string "#T"

# Enable mouse compatibility
set -g mouse on

# Enable tpm
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'

# Bring back zero-indexing
set -g base-index 0
set -g pane-base-index 0

# Themes
set -g @plugin 'hnielsen123/monochrome-night-tmux'
set -g @monochrome-night-tmux_show_netspeed 0
set -g @monochrome-night-tmux_show_ip 0 #temporary due to bug in psmux 3.4.0, only affects showing IP while connected to VPN which I don't really use on windows anyways
set -g @monochrome-night-tmux_network_iface_mode tun_only

# Navigate windows using shift left and right or alt+h and alt+l
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n M-h previous-window
bind -n M-l next-window

# Navigate sessions using option left and right
bind -n M-Left  switch-client -p
bind -n M-Right switch-client -n

# Move between panes with vim keys
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Kill panes and windows without confirmation
bind x kill-pane
bind & kill-window

# New panes with vim keys
bind C-l split-window -h
bind C-j split-window -v

# Let escape exit copy mode in emacs binding mode
bind -T copy-mode Escape send-keys -X cancel

run '~/.psmux/plugins/ppm/ppm.ps1'
